baseURL = "https://larsnystrom.github.io/larsnystrom.dev/"
locale = "en-us"
title = "Lars Nystrom"
theme = "shibui"
publishDir = "docs"
enableRobotsTXT = true

[params]
  [params.author]
    name = "Lars Nystrom"
    email = "hello@larsnystrom.dev"
  description = "Personal site built with Hugo and the Shibui theme."

[markup]
  defaultMarkdownHandler = "goldmark"
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 1

  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 2
