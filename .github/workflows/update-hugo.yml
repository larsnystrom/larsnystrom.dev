name: Update Hugo

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: update-hugo
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Check latest Hugo release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(cat .hugo-version)
          latest=$(gh api repos/gohugoio/hugo/releases/latest --jq '.tag_name')
          latest=${latest#v}
          if [[ ! "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || ! "$latest" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid Hugo version: current=$current latest=$latest"
            exit 1
          fi
          if [[ "$current" != "$latest" && "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n 1)" == "$latest" ]]; then
            echo "version=$latest" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$latest" > .hugo-version
          fi

      - name: Create or update pull request
        id: pull-request
        if: steps.release.outputs.version != ''
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          add-paths: .hugo-version
          branch: update-hugo
          commit-message: "Update Hugo to ${{ steps.release.outputs.version }}"
          title: "Update Hugo to ${{ steps.release.outputs.version }}"
          body: |
            Updates Hugo to version ${{ steps.release.outputs.version }}.

            Release notes: https://github.com/gohugoio/hugo/releases/tag/v${{ steps.release.outputs.version }}

      - name: Start build check
        if: steps.pull-request.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ steps.pull-request.outputs.pull-request-branch }}
        run: gh workflow run build.yml --ref "$PR_BRANCH"
